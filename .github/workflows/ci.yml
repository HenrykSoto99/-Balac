name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    # Linux for the shared code, macOS for the Swift helpers, Windows for the Parakeet voice helper.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: showcase/tauri
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: showcase/tauri/sidecar/package-lock.json

      - name: Install sidecar dependencies
        working-directory: showcase/tauri/sidecar
        run: npm ci

      - name: Test sidecar
        working-directory: showcase/tauri/sidecar
        run: npm test

      # Tauri's Linux build dependencies (v2.tauri.app/start/prerequisites, Debian list).
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            showcase/tauri/src-tauri -> target
            showcase/tauri/src-tauri/voice-win -> target

      # Copies the web files into dist/, bundles the sidecar, then `cargo build` (debug). On macOS this also
      # compiles the Swift helpers; on Windows it builds the voice helper first (release, as shipped).
      - name: Build
        run: ./build.sh dev

      - name: Test the macOS voice helper
        if: runner.os == 'macOS'
        run: |
          src-tauri/binaries/roamies-voice-"$(rustc -vV | sed -n 's/^host: //p')" --test-gain
          src-tauri/binaries/roamies-voice-"$(rustc -vV | sed -n 's/^host: //p')" --test-snap
          src-tauri/binaries/roamies-voice-"$(rustc -vV | sed -n 's/^host: //p')" --test-clicks

      - name: Test the macOS hands helper
        if: runner.os == 'macOS'
        run: |
          src-tauri/binaries/roamies-hands-"$(rustc -vV | sed -n 's/^host: //p')" --self-test

      # --release reuses the voice helper build.sh just made instead of compiling Parakeet again.
      - name: Test the Windows voice helper
        if: runner.os == 'Windows'
        run: cargo test --release --locked --manifest-path src-tauri/voice-win/Cargo.toml --target x86_64-pc-windows-msvc
